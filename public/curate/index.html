<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="10秒 フィード探し">
<title>10秒 フィード探し</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../style.css">
</head>
<body class="curate">
<header>
  <span id="status"></span>
  <button id="open-settings" type="button" aria-label="設定">⚙︎</button>
</header>
<main>
  <h1>読書の傾向</h1>
  <section id="trend"><p class="hint">読み込み中…</p></section>
  <h1>おすすめのフィード</h1>
  <nav id="tabs" class="tabs"></nav>
  <section id="recs"></section>
</main>
<dialog id="settings">
  <form method="dialog">
    <h2>GitHubトークン</h2>
    <p class="hint">リーダーと同じトークンを使います（同じブラウザなら入力済み）。</p>
    <p class="hint">fine-grained PAT の Repository access に <b>ten-second-reader-data</b> と <b>ten-second-reader</b> の両方を選び、Contents を Read and write にしてください。履歴を読むのに前者、フィードを追加するのに後者が必要です。</p>
    <input id="token" type="password" placeholder="GitHubトークン" autocomplete="off">
    <button id="save-token" type="button">保存</button>
    <button class="close">閉じる</button>
  </form>
</dialog>
<script src="curate.js" type="module"></script>
</body>
</html>
