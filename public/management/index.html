<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="10秒 Mgmt">
<title>10秒 マネジメント</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <span id="count"></span>
  <span>
    <span id="updated"></span>
    <button id="open-settings" type="button" aria-label="設定">⚙︎</button>
  </span>
</header>
<main id="list" aria-live="polite"></main>
<section id="done" hidden>
  <p class="done-mark">✓</p>
  <p class="done-title">完了</p>
  <p class="done-sub" id="done-sub"></p>
</section>
<dialog id="settings">
  <form method="dialog">
    <h2>表示するフィード</h2>
    <p class="hint">チェックを外したフィードは除外されます。</p>
    <ul id="feeds"></ul>
    <h2>履歴の同期</h2>
    <p class="hint">開いた記事の履歴と除外リストを非公開リポジトリ（ten-second-reader-data）に保存します。</p>
    <input id="token" type="password" placeholder="GitHubトークン" autocomplete="off">
    <button id="save-token" type="button">保存して同期</button>
    <p id="sync-status" class="hint"></p>
    <button class="close">閉じる</button>
  </form>
</dialog>
<footer>
  <button id="finish" type="button">読んだ</button>
</footer>
<script src="../app.js" type="module"></script>
</body>
</html>
